[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Rediriger tous les appels /api/* vers les Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback pour /admin
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Uploads servis depuis Cloudinary (via URL directe) — pas besoin de redirection locale

[dev]
  command = "echo 'Netlify Dev'"
  port = 8888
  publish = "public"
  functions = "netlify/functions"
